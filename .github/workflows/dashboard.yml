name: Vantage dashboard

# Refreshes the committed snapshot (market series + primary-source items) and
# publishes dashboard/ to GitHub Pages. The runner has open internet, so the
# feeds are fetched here rather than in the visitor's browser.

on:
  schedule:
    - cron: '0 */6 * * *'      # every six hours, UTC
  workflow_dispatch:
  push:
    branches: [claude/jolly-carson-y9zdl4]
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: vantage-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build data.json
        # refresh.py uses the standard library only — nothing to install.
        run: python3 dashboard/refresh.py
        env:
          # Optional. The SEC asks for a contact address in automated requests.
          # Set a repository variable named CONTACT_EMAIL to supply one.
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}

      - name: Commit the snapshot if it changed
        run: |
          if git diff --quiet -- dashboard/data.json; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data.json
          git commit -m "Refresh dashboard snapshot"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
